<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Гра "Бункер"</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Підготовка до Бункеру</h1>

    <div class="controls">
      <div class="controls-group">
        <label for="playerCount">Кількість гравців (від 4 до 20):</label>
        <input type="number" id="playerCount" min="4" max="20" value="4" />
        <button id="startGameButton" class="btn-primary">Розпочати Гру</button>
      </div>
    </div>

    <hr style="margin: 25px 0" />

    <div id="cardsHeaderBlock" style="display: none">
      <button
        id="toggleAllBtn"
        class="btn-secondary"
        onclick="toggleAllCards()"
      >
        🔓 Розгорнути всі картки
      </button>
    </div>

    <h2>Згенеровані Картки:</h2>
    <div id="cardsContainer"></div>

    <script src="baggage.js"></script>
    <script src="body.js"></script>
    <script src="race.js"></script>
    <script src="disaster.js"></script>
    <script src="profession.js"></script>
    <script src="health.js"></script>
    <script src="game.js"></script>
    <script src="DopInfo.js"></script>

    <script>
      // Функція для кнопки "Розгорнути/Згорнути всі"
      let allExpanded = false;
      function toggleAllCards() {
        const detailsList = document.querySelectorAll(".card-details");
        const cardsList = document.querySelectorAll(".player-card");
        const btn = document.getElementById("toggleAllBtn");

        allExpanded = !allExpanded;

        detailsList.forEach((details, index) => {
          if (allExpanded) {
            details.classList.add("visible");
            cardsList[index].style.backgroundColor = "#d1e7dd";
          } else {
            details.classList.remove("visible");
            cardsList[index].style.backgroundColor = "#ffffff";
          }
        });

        btn.innerText = allExpanded
          ? "🔒 Згорнути всі картки"
          : "🔓 Розгорнути всі картки";
      }
    </script>
  </body>
</html>
